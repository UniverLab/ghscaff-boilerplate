[template]
name = "python-fastapi"
language = "Python"
description = "FastAPI daemon with uvicorn, SQLAlchemy, Pydantic, and SSE support"
version = "1.0.0"

[placeholders]
name = "Project name (snake_case)"
description = "Short description of the project"
github_org = "GitHub organization/username"
github_repo = "GitHub repository name"

[files]
include = [
  "pyproject.toml",
  "src/__init__.py",
  "src/main.py",
  "src/config.py",
  "src/api/__init__.py",
  "src/api/routes.py",
  "src/db/__init__.py",
  "src/db/engine.py",
  "tests/__init__.py",
  "tests/test_main.py",
  "README.md",
  "CONTRIBUTING.md",
  ".github/workflows/ci.yml",
  ".gitignore",
  "secrets.toml"
]

[gitignore]
template = "Python"

[ci]
workflow_name = "CI"
branches = ["main", "develop"]
runs_on = "ubuntu-latest"
